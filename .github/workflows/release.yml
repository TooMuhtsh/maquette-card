name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  asset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Vérifier la version
        run: |
          v=$(node -p "require('./package.json').version")
          test "v$v" = "${{ github.event.release.tag_name }}" || { echo "tag ${{ github.event.release.tag_name }} ≠ v$v"; exit 1; }
      - name: Construire et minifier (src/ et dist/ restent lisibles dans le dépôt)
        run: |
          node build.mjs --min
          ls -l dist/ release/
      # HACS télécharge TOUS les fichiers joints à la release dans www/community/maquette-card/ ; la ressource enregistrée reste
      # maquette-card.js (« filename » de hacs.json), qui charge maquette-editeur.js depuis le même dossier à l'ouverture de l'éditeur
      - name: Joindre les fichiers à la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" release/maquette-card.js release/maquette-editeur.js --clobber
