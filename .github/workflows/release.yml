name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  asset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run build
      - name: Vérifier la version
        run: |
          v=$(node -p "require('./package.json').version")
          test "v$v" = "${{ github.event.release.tag_name }}" || { echo "tag ${{ github.event.release.tag_name }} ≠ v$v"; exit 1; }
      - name: Minifier (src/ et dist/ restent lisibles dans le dépôt)
        run: |
          mkdir -p release
          npx --yes terser@5.38.0 dist/maquette-card.js --module --compress --mangle --comments '/^!/' -o release/maquette-card.js
          node --check release/maquette-card.js
          ls -l dist/maquette-card.js release/maquette-card.js
      - name: Joindre le fichier à la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" release/maquette-card.js --clobber
